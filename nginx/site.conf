# crm.dunacon.pe — Todo el sistema en el VPS Contabo.
# Nginx sirve el FRONTEND (Next.js, export estático) y proxye la API/WebSocket al backend.
# Fase inicial: HTTP 80 + desafío ACME; ya puedes copiar site-ssl.conf tras el cert.

server {
    listen 80;
    server_name crm.dunacon.pe;

    # Certbot HTTP-01 (webroot en ./nginx/html)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ===== FRONTEND (build estático de Next.js en ./nginx/html) =====
    # El export estático se copia dentro de nginx/html ANTES de levantar.
    location / {
        root /var/www/html;
        try_files $uri $uri/ $uri.html /index.html =404;
        # Cache para assets con hash (imgs/css/js) y no-cache para HTML
        location ~*\.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ===== API (Nest) =====
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== Archivos subidos (planos/imágenes locales) =====
    location /uploads/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== Socket.IO (tiempo real) =====
    location /socket.io/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
