# docker-compose — backend + reverse proxy Nginx para Contabo.
# El backend (Nest) usa Supabase y Cloudinary. Ningún secreto hardcodeado.

services:
  backend:
    build:
      context: ./backend
    container_name: crm_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # Conexión Supabase (Pooler) — credenciales desde .env del servidor
      DB_HOST: ${DB_HOST:?Define DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:?Define DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      DB_NAME: ${DB_NAME:-postgres}
      DB_SSL: ${DB_SSL:-true}
      # Autenticación API
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRES_IN: 1d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      UPLOAD_DIR: /tmp/uploads
      # Cloudinary — name público, API_KEY/SECRET requeridos desde .env
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME?Defina CLOUDINARY_CLOUD_NAME en .env}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?Define CLOUDINARY_API_KEY en .env}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?Define CLOUDINARY_API_SECRET en .env}
    # Acceso solo por la red interna de Docker (service name: backend:3001).
    command: >
      sh -c "echo Aplicando migraciones contra Supabase... &&
      node dist/config/bootstrap-migrate.js &&
      echo Migraciones OK - arrancando API... &&
      exec node dist/main.js"

  # Reverse proxy + TLS (Let's Encrypt) para crm.dunacon.pe.
  # Sirve el FRONTEND (build estático en ./nginx/html) y proxye la API/WebSocket al backend.
  nginx:
    image: nginx:1.27-alpine
    container_name: crm_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/site.conf:/etc/nginx/conf.d/crm.dunacon.pe.conf:ro
      - ./nginx/site-ssl.conf:/etc/nginx/conf.d/crm-ssl.disabled:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/html:/var/www/html:ro
      - ./letsencrypt/etc:/etc/letsencrypt:ro
      - ./letsencrypt/lib:/var/lib/letsencrypt:ro
    depends_on:
      - backend


